/* Una superficie a tutto schermo che invecchia e non si ripete; un pannello scuro in basso a sinistra, che compare al tocco. */
:root{--ground:#0d0d0c;--panel:#121211;--fg:#ecebe5;--mute:#9c9b94;--line:#2e2e2b;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--fg);overflow:hidden;font:13px/1.35 "Redaction 50","Times New Roman",Georgia,serif;letter-spacing:.01em;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#tela{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ground);cursor:pointer}
.pannello{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(360px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));box-sizing:border-box;
  background:var(--panel);border:1px solid var(--line);padding:12px 12px 10px;display:grid;gap:12px;font-variant-numeric:tabular-nums}
.titolo{font-size:15px;font-weight:700;letter-spacing:.04em}
.colori{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
button{font:inherit;color:var(--fg);background:transparent;cursor:pointer;letter-spacing:.02em}
.col{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:5px 8px 5px 5px}
.col i{width:14px;height:14px;display:block;background:var(--c);box-shadow:inset 0 0 0 1px var(--line)}
.modi{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--fg)}
.modi button{font-weight:700;border:0;padding:8px 10px}
.modi button+button{border-left:1px solid var(--fg)}
.modi button[aria-pressed="true"],.azioni button:hover,.col:hover{background:var(--fg);color:var(--panel)}
.regole{display:grid;gap:10px}
.regola{display:grid;gap:3px}
.regola label{display:flex;justify-content:space-between;gap:8px;color:var(--mute);letter-spacing:.04em}
.regola output{color:var(--fg);letter-spacing:.01em}
input[type=range]{width:100%;margin:0;height:24px;accent-color:var(--fg);cursor:pointer}
.azioni{display:flex;flex-wrap:wrap;gap:6px}
.azioni button{font-weight:700;border:1px solid var(--fg);padding:7px 10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.nota{margin:0;color:var(--mute);min-height:1.35em;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<canvas id="tela" role="img" aria-label="Superficie generativa in continua trasformazione"></canvas>

<div class="pannello" id="pannello">
  <div class="titolo">Momento_0</div>
  <div class="colori" id="colori" aria-label="Colori principali sullo schermo"></div>
  <div class="modi" role="group" aria-label="Modalità">
    <button type="button" id="bEvo">Evoluzione</button>
    <button type="button" id="bNas">Nascita</button>
  </div>
  <div class="regole">
    <div class="regola"><label for="rGen">Generazione <output id="oGen" for="rGen"></output></label><input type="range" id="rGen" min="1" max="30" step="1"></div>
    <div class="regola"><label for="rDur">Durata <output id="oDur" for="rDur"></output></label><input type="range" id="rDur" min="1" max="40" step="1"></div>
  </div>
  <div class="modi" role="group" aria-label="Formato della cattura" id="formati"></div>
  <div class="azioni">
    <button id="bCattura" type="button">Cattura</button>
    <button id="bFerma" type="button">Ferma</button>
    <button id="bNuovo" type="button">Nuovo</button>
    <button id="bFull" type="button">Schermo intero</button>
    <button id="bCopia" type="button">Copia codici</button>
    <button id="bDir" type="button" hidden>Cartella</button>
  </div>
  <p class="nota" id="nota" aria-live="polite">Tocca lo schermo per mostrare o nascondere il pannello.</p>
</div>

<script>
(()=>{"use strict";
const TAU=Math.PI*2,$=id=>document.getElementById(id),NU=96,NC=32;
const F=x=>{const s=Math.abs(+x||0).toFixed(5);return x<0?"(-"+s+")":s;};
const hsl=(h,s,l)=>{h=((h%1)+1)%1;const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{t=((t%1)+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};return[f(h+1/3),f(h),f(h-1/3)];};
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*.8;
const lowEnd=!!((navigator.deviceMemory&&navigator.deviceMemory<=2)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4));

const VS="#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
const HASH=`
uint hu(vec2 p){uvec2 q=uvec2(ivec2(floor(p)))*uvec2(1597334673u,3812015801u);return(q.x^q.y)*1597334673u;}
float h1(vec2 p){return float(hu(p))/4294967295.;}
mat2 rt(float a){float s=sin(a),k=cos(a);return mat2(k,s,-s,k);}`;
const LIB=`#version 300 es
precision highp float;
uniform vec2 uR;uniform float uT,uK;uniform vec4 u[${NU}];uniform vec3 c[${NC}];
layout(location=0)out vec4 oC;layout(location=1)out vec4 oH;
const float TAU=6.2831853;${HASH}
vec2 h2(vec2 p){uint n=hu(p);return vec2(float(n),float(n*48271u))/4294967295.;}
float tri(float x){return abs(fract(x)-.5)*2.;}
float gd(vec2 i,vec2 f){return dot(h2(i)-.5,f);}
float gn(vec2 p){vec2 i=floor(p),f=p-i,w=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(gd(i,f),gd(i+vec2(1,0),f-vec2(1,0)),w.x),mix(gd(i+vec2(0,1),f-vec2(0,1)),gd(i+1.,f-1.),w.x),w.y)*3.7;}
/* frattale: m=0 nuvola, 1 cresta, 2 bolla */
float fb(vec2 p,int n,float l,float g,int m){float s=0.,a=1.,t=0.,w=1.;
  for(int i=0;i<8;i++){if(i>=n)break;float v=gn(p);
    if(m==1){v=1.-abs(v);v*=v*w;w=clamp(v*1.5,0.,1.);}else if(m==2)v=abs(v)*1.7;else v=.5+.8*v;
    s+=a*v;t+=a;a*=g;p=rt(.6)*p*l+17.3;}
  return clamp(s/t,0.,1.);}
/* celle: distanza dal centro, distanza dal bordo, identità */
vec3 vo(vec2 p,float j){vec2 i=floor(p),f=p-i;float a=9.,b=9.,d=0.;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(x,y),r=g+.5+j*(h2(i+g)-.5)-f;float q=dot(r,r);
    if(q<a){b=a;a=q;d=h1(i+g+vec2(37.,91.));}else if(q<b)b=q;}
  return vec3(sqrt(a),sqrt(b)-sqrt(a),d);}
`;

/* =====================================================================
   GENOMA — un flusso di numeri casuali registrato. Lo stesso flusso riscrive
   la stessa superficie; ritoccarne i valori continui la fa derivare, troncarlo
   genera un discendente (stessa base, mani nuove).
   Una superficie = fondo + mani di colore, ognuna con campo, bordo, tinta,
   spessore e lucido; poi luce radente e ottica (vedi OTTICA).
   ===================================================================== */
function build(G){
  const a=G.a,ci=G.ci=[];let i=0,cost=0;
  const rnd=()=>{if(i>=a.length)a.push(Math.random());return a[i++];};
  const R=(x,y)=>x+(y-x)*rnd(),RI=(x,y)=>Math.min(y,Math.floor(R(x,y+1))),ch=p=>rnd()<p,pick=l=>l[Math.min(l.length-1,Math.floor(rnd()*l.length))];
  const wp=l=>{let t=0;for(const e of l)t+=e[0];let q=rnd()*t;for(const e of l)if((q-=e[0])<=0)return e[1];return l[l.length-1][1];};
  /* X: valore continuo (può derivare) · P: lo stesso, come uniforme · K: costante cotta nel programma */
  const X=(lo,hi,lg)=>{ci.push(i);const x=rnd();return lg?lo*Math.pow(hi/lo,x):lo+(hi-lo)*x;};
  const uv=[],cv=[],fs=[],fl=[];
  const P=(lo,hi,lg)=>{const v=X(lo,hi,lg);if(uv.length>=NU*4)return F(v);uv.push(v);const k=uv.length-1;return"u["+(k>>2)+"]."+"xyzw"[k&3];};
  const K=(lo,hi)=>F(lo*Math.pow(hi/lo,rnd())),sg=()=>ch(.5)?"-":"",tm=(lo,hi)=>ch(.3)?"+uT*"+sg()+K(lo,hi):"";
  const BUD=R(4,9)*(lowEnd?.6:1);

  /* OTTICA — 32 valori; sotto zero l'effetto è spento, così accendersi e spegnersi è una deriva continua */
  const post=[
    X(-.2,1.1),X(-.9,.9),X(0,TAU),X(.35,1.2),       /* rilievo fine, rilievo largo, angolo e altezza della luce */
    X(-1.2,.8),X(4,80,1),X(-.4,1),X(-.6,.8),           /* lucido, durezza, sporco nelle cavità, consumo delle creste */
    X(-6,5),X(0,TAU),X(0,1),X(-5,3),                 /* fuori registro (px), angolo, radiale, fuoco inclinato */
    X(0,TAU),X(-.5,.5),X(-.9,.7),X(0,.11),           /* asse del fuoco, scarto, alone, grana */
    X(1,3.2,1),X(0,1),X(-5,.9),X(3,14,1),          /* passo grana, croma grana, retino, passo retino */
    X(0,TAU),X(-3.5,1),X(2,7),X(0,.9),               /* angolo retino, posterizzazione, livelli, retinatura */
    X(.92,1.35),X(.75,1.35),X(.8,1.25,1),X(1,3,1),   /* contrasto, saturazione, gamma, passo del rilievo */
    X(-1,1),X(.35,.95),X(-2.6,1.2),X(0,1)];          /* temperatura della luce, ombra, morbidezza, retinatura ordinata/casuale */

  /* TAVOLOZZA — peso, tinte, apertura, saturazione min/max, luce min/max, accento, tinte assolute */
  const pm=wp([[3,[0],.5,.3,1,.1,.9,.1],[2,[0],.09,.4,1,.12,.88,.15],[2,[0,.5],.03,.5,1,.15,.85,.1],[1.5,[0,1/3,2/3],.02,.5,1,.2,.8,0],
    [1.5,[0],0,.2,1,.03,.97,.2],[2.5,[.16,.3,.8,.9,.55,0],.04,1,1,.45,.62,.25,1],[1.5,[0],.5,.3,.8,.74,.93,.1],[2,[.09],.07,.15,.65,.08,.72,.25,1],
    [2,[0],.5,0,.14,.2,.93,.4],[1.5,[0],.5,.3,1,.02,.2,.4],[1.5,[.5],.08,.2,.7,.1,.8,.2,1],[1,[0],.5,0,.1,.05,.95,.25]].map(e=>[e[0],e])),bh=X(0,1);
  /* libero, analogo, complementare, triade, mono, acido, pastello, terra, muro, notte, acqua, metallo */
  const C=()=>{let h,s,l;
    if(ch(pm[7])){const k=rnd();h=X(0,1);if(k<.6){s=X(.85,1);l=X(.45,.62);}else if(k<.8){s=X(0,.3);l=X(0,.07);}else{s=X(0,.25);l=X(.9,1);}}
    else{h=(pm[8]?0:bh)+pick(pm[1])+(X(0,1)-.5)*2*pm[2];s=X(pm[3],pm[4]);l=X(pm[5],pm[6]);}
    cv.push(hsl(h,s,l));return"c["+(cv.length-1)+"]";};
  const pal=[];for(let k=RI(3,6);k--;)pal.push(C());
  const col=()=>ch(.82)||cv.length>=NC?pal[Math.floor(Math.pow(rnd(),1.5)*pal.length)]:C();
  const ramp=t=>{let e=col();for(let k=wp([[2,0],[5,1],[3,2],[1.5,3]]);k--;){const s=P(.12,.8);
    e="mix("+e+","+col()+",smoothstep("+s+","+s+"+"+(ch(.4)?P(.004,.04,1):P(.05,.5,1))+","+t+"))";}return e;};

  /* CAMPI — processi naturali elementari: [frequenza min, max, costo, pesi per ruolo (fondo, bordo, rilievo, tinta), codice] */
  const CORE={
    nuvola:[1,14,1,[3,4,2,4],()=>`v=fb(p,${RI(3,7)},${P(1.7,2.7)},${P(.35,.75)},0);`],
    cresta:[1,10,1,[2,2,3,2],()=>`v=fb(p,${RI(3,7)},${P(1.7,2.7)},${P(.35,.7)},1);`],
    bolla:[1.5,16,1,[2,2,3,1],()=>`v=fb(p,${RI(2,6)},${P(1.7,2.7)},${P(.3,.7)},2);`],
    crepa:[3,45,1.6,[1,3,2,.5],()=>`vec3 w=vo(p,${P(.4,1)});v=1.-smoothstep(0.,${P(.02,.35,1)}*(.5+fb(p*.37,2,2.,.5,0)),w.y);`],
    scaglia:[3,40,1.3,[1.5,3,2,1.5],()=>`vec3 w=vo(p,${P(.4,1)});v=mix(w.z,smoothstep(0.,.5,w.y),${P(0,.8)});`],
    poro:[5,70,1.3,[1,1.5,2,.5],()=>`vec3 w=vo(p,1.);v=1.-smoothstep(0.,${P(.15,.6)},w.x-${P(.02,.3)});`],
    verme:[1,12,1,[1.5,2,1.5,1.5],()=>`v=tri(fb(p*.5,${RI(2,4)},2.,.5,0)*${P(1.5,8)});`],
    fibra:[3,40,1,[2,1.5,2.5,2],()=>`v=fb(p*vec2(1.,${P(.02,.2,1)}),${RI(3,6)},2.,${P(.4,.75)},${RI(0,2)});`],
    onda:[3,30,1,[1.2,1,1.5,1.5],()=>{let s="";const n=RI(2,5);for(let k=n;k--;)s+=`+sin(length(p-vec2(${F(R(-30,30))},${F(R(-30,30))}))*${P(2,9)}-uT*${K(.1,1.5)})`;return`v=.5+.8*(${s.slice(1)})/${n}.;`;}],
    anello:[2,25,.7,[1,.8,1,1.5],()=>`v=tri(length(p-vec2(${F(R(-40,40))},${F(R(-40,40))}))*${P(.3,2)}+${P(0,1.5)}*gn(p*.7));`],
    punto:[25,220,1,[.6,1.5,.8,.8],()=>`vec2 q=fract(p)-.5;v=.5-(length(q)-${P(.1,.5)}*(.3+1.4*fb(floor(p)*${P(.02,.3,1)},2,2.,.5,0)))/${P(.01,.15,1)};`],
    graffio:[1.5,10,1.2,[.2,2,1.5,.3],()=>{const s=P(.008,.07,1),e=P(8,60,1);return`v=pow(max(0.,1.-abs(gn(p*vec2(1.,${s})))),${e});v=max(v,pow(max(0.,1.-abs(gn(rt(${P(.1,1.4)})*p*vec2(1.,${s})+7.))),${e}))*smoothstep(0.,.3,fb(p*.21,2,2.,.5,0)-${P(.2,.6)});`;}],
    macchia:[2,22,1.2,[.8,3,1,1],()=>{const s=P(.4,.75);return`v=smoothstep(${s},${s}+.25,.3+.5*gn(p*${P(4,20,1)})+${P(.5,2.5)}*(fb(p,4,2.,.55,0)-.5));`;}],
    trama:[25,260,.8,[1.2,.5,2,.5],()=>`vec2 q=p*vec2(1.,${P(.5,2,1)});v=mix(abs(sin(q.x*3.1416)),abs(sin(q.y*3.1416)),step(.5,fract((floor(q.x)+floor(q.y))*.5)))*(.8+.4*gn(q*${P(2,9)}));`],
    riga:[2,60,.4,[1.2,1.5,2,1],()=>`v=mix(tri(p.x),.5+.5*sin(p.x*TAU),${P(0,1)});`],
    sagoma:[.6,3.5,.5,[.8,2.5,.2,1.5],()=>"v=.5+("+wp([[2,()=>"p.x"],[1.5,()=>P(.1,.6)+"-abs(p.x)"],[2,()=>P(.2,.9)+"-length(p)"],[1.5,()=>P(.2,.8)+"-max(abs(p.x),abs(p.y)*"+P(.4,2.5,1)+")"]])()+")*"+P(1,40,1)+";"]};
  /* PIEGHE del dominio: piega, deriva, onda, flusso, gradino (mosaico locale), strappo */
  const WARP=[
    [4,()=>`p+=${P(.05,1.2,1)}*vec2(gn(p*${P(.2,3,1)}+3.1${tm(.01,.3)}),gn(p*${P(.2,3,1)}+7.7));`],
    [3,()=>`p+=${P(.2,4,1)}*(vec2(fb(p*${P(.15,1.5,1)},3,2.,.5,0),fb(p*.6+9.,3,2.,.5,0))-.5);`],
    [2,()=>`p+=${P(.03,.6,1)}*sin(p.yx*${P(.3,6,1)}+${P(0,TAU)}${tm(.02,.5)});`],
    [1.2,()=>`p+=${P(.1,1.5,1)}*rt(TAU*gn(p*${P(.1,1.2,1)}))[0];`],
    [.8,()=>{const n=P(.6,6,1);return`p=mix(p,(floor(p*${n})+.5)/${n},${P(.5,1)});`;}],
    [.5,()=>`p.x+=${P(.1,2,1)}*(h1(vec2(floor(p.y*${P(.3,5,1)}),7.))-.5);`]];
  /* CURVE del valore: nessuna, gamma, contrasto, terrazze, piega, bande, negativo */
  const CURVE=[[4,()=>""],[2,()=>`v=pow(clamp(v,0.,1.),${P(.4,2.5,1)});`],[2.5,()=>{const s=P(.15,.7);return`v=smoothstep(${s},${s}+${P(.03,.6,1)},v);`;}],
    [1.5,()=>{const e=P(.01,.5,1);return`{float n=${P(2,7)},z=clamp(v,0.,1.)*n;v=(floor(z)+smoothstep(.5-${e},.5+${e},fract(z)))/n;}`;}],
    [1,()=>"v=abs(v*2.-1.);"],[1,()=>`v=tri(v*${P(1,5)});`],[1,()=>"v=1.-v;"]];
  const campo=r=>{const nm=wp(Object.keys(CORE).map(k=>[CORE[k][3][r],k])),co=CORE[nm],fr=P(co[0],co[1],1);
    let b="p=rt("+P(0,TAU)+")*p*"+fr+(ch(.25)?"*vec2(1.,"+P(.08,1,1)+")":"")+"+vec2("+(nm==="sagoma"?P(-1,1)+","+P(-1,1):P(-60,60)+","+P(-60,60))+")"+(ch(.3)?"+uT*vec2("+sg()+K(.002,.06)+","+sg()+K(.002,.06)+")":"")+";";
    for(let k=wp([[3,0],[4,1],[2,2],[1,3]]);k--;)b+=wp(WARP)();
    b+="float v;"+co[4]();
    if(ch(.45))b+="v+="+P(.02,.3,1)+"*gn(p*"+P(3,14,1)+");";
    b+=wp(CURVE)();
    const o={n:"f"+fs.length+"(p)",fr};fs.push("float f"+fs.length+"(vec2 p){"+b+"return clamp(v,0.,1.);}");cost+=co[2];fl.push(o);return o;};
  const nuovo=r=>cost<BUD?campo(r):pick(fl);

  /* inquadratura */
  let b="vec2 p=(gl_FragCoord.xy-.5*uR)/max(uR.x,uR.y);";
  if(ch(.1)){const n=K(40,260);b+="p=(floor(p*"+n+")+.5)/"+n+";";}
  b+="p=rt("+P(0,TAU)+")*p*"+P(.45,2.2,1)+";vec3 col,k;float H,S,m=1.,m0,h,t,mv,a;";
  /* fondo */
  const f0=campo(0);
  b+="h="+f0.n+";t="+(ch(.5)?"h":campo(3).n)+";col="+ramp("t")+";"+(ch(.5)?"col*=1.+"+P(.1,.8)+"*("+nuovo(3).n+"-.5);":"")+"H="+P(.02,.5,1)+"/"+f0.fr+"*(h-.5);S="+P(0,1)+";";
  /* mani */
  for(let n=wp([[1,0],[3,1],[4,2],[3,3],[2,4],[1,5]]);n--;){
    const fm=nuovo(1),e=P(.002,.2,1);
    b+="m0=m;mv="+fm.n+(ch(.4)?"+"+sg()+P(.1,.8)+"*(h-.5)":"")+"-"+P(.3,.72)+(ch(.25)?"+"+K(.01,.08)+"*sin(uT*"+K(.02,.4)+"+"+F(R(0,TAU))+")":"")+";";
    /* bordo: netto o frastagliato, spruzzo, nastro */
    b+=wp([[5,()=>"m=smoothstep(-"+e+","+e+",mv"+(ch(.6)?"+"+P(.01,.25,1)+"*gn(p*"+K(40,600)+")":"")+");"],
      [1.5,()=>{const s=P(.08,.5);return"m=step(h1(p*"+K(300,1400)+"),smoothstep(-"+s+","+s+",mv));";}],
      [1,()=>"m=smoothstep(-"+e+","+e+",mv)*(1.-smoothstep(-"+e+","+e+",mv-"+P(.02,.25,1)+"));"]])();
    if(ch(.3))b+=ch(.5)?"m*=m0;":"m*=1.-m0;";
    /* rilievo e tinta */
    const r=rnd(),fh=r<.25?null:r<.45?pick(fl):nuovo(2);
    b+="h="+(fh?fh.n:"clamp(mv*2.+.5,0.,1.)")+";t="+wp([[4,()=>"h"],[2.5,()=>"clamp(mv+.5,0.,1.)"],[2,()=>pick(fl).n],[1.5,()=>nuovo(3).n]])()+";k="+ramp("t")+";";
    if(ch(.5))b+="k*=1.+"+P(.1,.9)+"*("+pick(fl).n+"-.5);";
    /* fusione: coprente, moltiplica, scherma, sovrapponi */
    const mode=wp([[6,0],[2,1],[1.2,2],[1,3]]);
    b+="a=m*"+(ch(.65)?"1.":P(.3,1))+";col=mix(col,"+["k","col*k*1.4","1.-(1.-col)*(1.-k)","mix(2.*col*k,1.-2.*(1.-col)*(1.-k),step(.5,col))"][mode]+",a);";
    /* orlo: contorno, bruciatura, labbro chiaro; dentro, fuori o a cavallo */
    if(ch(.45)){const w=P(.005,.12,1);
      b+="col=mix(col,"+wp([[3,()=>col()],[2,()=>"col*.3"],[2,()=>"min(col*1.6+.1,1.)"]])()+","+P(.3,1)+"*(1.-smoothstep(0.,"+w+",abs(mv"+(ch(.5)?"":"-"+w)+")))*"+wp([[2,"1."],[2,"m"],[1.5,"(1.-m)"]])+");";}
    /* spessore (in rilievo o scavato), grana propria, lucido */
    if(ch(mode?.35:.9))b+="H=mix(H,H*"+P(0,1)+(ch(.75)?"+":"-")+P(.0004,.008,1)+"+"+P(.02,.5,1)+"/"+(fh||fm).fr+"*(h-.5),m);S=mix(S,"+P(0,1)+",m);";
  }
  /* grana della materia: un micro-rilievo comune a tutte le mani */
  {const k=K(90,600);b+="H+=max(0.,"+P(-.25,.5)+")*(fb(p*"+k+",3,2.2,.6,"+RI(0,2)+")-.5)/"+k+";";}
  /* comparsa: la superficie nuova affiora attraverso la vecchia seguendo un suo campo */
  const ft=ch(.5)?pick(fl):ch(.7)?campo(1):null,e=P(.02,.5,1);
  b+="float al=1.;if(uK<1.){"+(ft?"al=smoothstep(-"+e+","+e+",mix(-"+e+",1.+"+e+",uK)-"+ft.n+");":"al=uK;")+"}oC=vec4(col,al);oH=vec4(.5+H*4.,S,0.,al);";
  const u=new Float32Array(NU*4),c=new Float32Array(NC*3);u.set(uv);cv.forEach((x,k)=>c.set(x,k*3));
  return{src:LIB+fs.join("\n")+"\nvoid main(){"+b+"}",u,c,post:new Float32Array(post)};
}

/* =====================================================================
   OTTICA — un solo programma fisso: luce radente dal rilievo, sporco e consumo,
   fuori registro, fuoco, alone, retino, posterizzazione, grana, sviluppo.
   ===================================================================== */
const POST=`#version 300 es
precision highp float;
uniform highp sampler2D tC,tH;uniform vec2 uR;uniform float uPx;uniform vec4 v[8];
out vec4 o;${HASH}
const float B[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
float hh(vec2 q,float l){return textureLod(tH,q,l).r;}
void main(){
  vec2 f=gl_FragCoord.xy,q=f/uR,px=uPx/uR;float M=max(uR.x,uR.y),lp=log2(uPx);
  float lod=max(0.,v[2].w)*abs(dot(q-.5,vec2(cos(v[3].x),sin(v[3].x)))+v[3].y)*1.2+max(0.,v[7].z),ll=lod+lp*smoothstep(0.,1.,lod);
  vec2 mo=max(0.,v[2].x)*px*mix(vec2(cos(v[2].y),sin(v[2].y)),(q-.5)*2.,v[2].z);
  vec3 col=vec3(textureLod(tC,q+mo,ll).r,textureLod(tC,q,ll).g,textureLod(tC,q-mo,ll).b);
  /* luce */
  float tp=v[6].w,hc=hh(q,ll);vec2 d=px*tp,dc=px*8.;
  vec2 g=vec2(hh(q+vec2(d.x,0),ll)-hh(q-vec2(d.x,0),ll),hh(q+vec2(0,d.y),ll)-hh(q-vec2(0,d.y),ll))*M/(8.*tp*uPx);
  vec2 gc=vec2(hh(q+vec2(dc.x,0),3.+lp)-hh(q-vec2(dc.x,0),3.+lp),hh(q+vec2(0,dc.y),3.+lp)-hh(q-vec2(0,dc.y),3.+lp))*M/(64.*uPx);
  vec3 n=normalize(vec3(-(g*max(0.,v[0].x)+gc*max(0.,v[0].y)),1.));
  vec3 L=vec3(cos(v[0].z)*cos(v[0].w),sin(v[0].z)*cos(v[0].w),sin(v[0].w));
  float df=dot(n,L)/L.z,T=v[7].x;
  vec3 wa=vec3(1.,.86,.66),co=vec3(.62,.78,1.),li=mix(vec3(1.),T>0.?wa:co,abs(T)),sh=mix(vec3(1.),T>0.?co:wa,abs(T))*(1.-v[7].y);
  col*=df<1.?mix(sh,vec3(1.),clamp(df,0.,1.)):1.+li*min(df-1.,1.5)*.6;
  float cv=(hh(q,4.+lp)-hc)*40.;
  col*=1.-clamp(cv,0.,1.)*max(0.,v[1].z);
  col=mix(col,min(col*1.5+.08,1.),clamp(-cv,0.,1.)*max(0.,v[1].w));
  float S=textureLod(tH,q,ll).g;
  col+=li*pow(max(dot(n,normalize(L+vec3(0,0,1))),0.),v[1].y)*S*S*max(0.,v[1].x);
  /* alone */
  col+=max(textureLod(tC,q,5.+lp).rgb-.55,0.)*max(0.,v[3].z);
  /* retino */
  float lum=dot(col,vec3(.3,.59,.11));
  {vec2 hp=rt(v[5].x)*f/(v[4].w*uPx);float r=length(fract(hp)-.5),ink=smoothstep(r-.1,r+.1,sqrt(clamp(1.-lum,0.,1.))*.72);
   col=mix(col,mix(min(col*1.3+.12,1.),col*.3,ink),clamp(v[4].z,0.,1.));}
  /* posterizzazione e retinatura */
  {vec2 dp=floor(f/(uPx*max(1.,v[4].x)));ivec2 bi=ivec2(dp)&3;float n2=floor(v[5].z),dt=(mix(B[bi.x+bi.y*4]/16.,h1(dp),step(.5,v[7].w))-.5)*v[5].w;
   col=mix(col,floor(col*n2+.5+dt)/n2,clamp(v[5].y,0.,1.));}
  /* grana */
  {vec2 gp=floor(f/(uPx*v[4].x)),gq=floor(f/v[4].x)+311.;   /* due passi: quello visto a schermo e quello del pixel reale */
   vec3 gr=vec3(h1(gp)+h1(gq),h1(gp+71.)+h1(gq+71.),h1(gp+133.)+h1(gq+133.))*.7-.7;
   col+=mix(vec3(gr.x),gr,v[4].y)*v[3].w*(.4+.6*(1.-abs(2.*lum-1.)));}
  /* sviluppo */
  col=(col-.5)*v[6].x+.5;col=mix(vec3(dot(col,vec3(.3,.59,.11))),col,v[6].y);col=pow(max(col,0.),vec3(v[6].z));
  o=vec4(clamp(col,0.,1.),1.);
}`;

/* =====================================================================
   MACCHINA — WebGL2: le superfici si dipingono una sull'altra in un bersaglio
   (colore + rilievo), l'ottica lo porta sullo schermo.
   ===================================================================== */
const tela=$("tela"),nota=$("nota"),note=t=>{nota.textContent=t;};
const gl=tela.getContext("webgl2",{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:"high-performance"});
if(!gl){$("pannello").hidden=false;note("Questo browser non offre WebGL2: lo strumento non può partire.");return;}
const HF=!!(gl.getExtension("EXT_color_buffer_float")||gl.getExtension("EXT_color_buffer_half_float"));
const MAXT=gl.getParameter(gl.MAX_TEXTURE_SIZE),MAXL=lowEnd?1280:1920;
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)){const l=gl.getShaderInfoLog(x);gl.deleteShader(x);throw new Error(l);}return x;};
const vs=sh(gl.VERTEX_SHADER,VS);
function prog(src,names){const f=sh(gl.FRAGMENT_SHADER,src),p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,f);gl.bindAttribLocation(p,0,"a");gl.linkProgram(p);gl.deleteShader(f);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){const l=gl.getProgramInfoLog(p);gl.deleteProgram(p);throw new Error(l);}
  const o={p};for(const n of names)o[n]=gl.getUniformLocation(p,n);return o;}
const post=prog(POST,["tC","tH","uR","uPx","v"]);
/* bersaglio: colore a 8 bit e rilievo a 16 bit, con le loro versioni sfocate (mipmap) */
function target(t,w,h){t=t||{f:gl.createFramebuffer(),x:[gl.createTexture(),gl.createTexture()]};
  gl.bindFramebuffer(gl.FRAMEBUFFER,t.f);
  t.x.forEach((x,i)=>{gl.bindTexture(gl.TEXTURE_2D,x);
    if(i&&HF)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,x,0);});
  gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);t.w=w;t.h=h;
  t.ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;return t;}
/* dipinge le superfici `list` nel bersaglio `t`, poi l'ottica `pv` verso `out` (null = schermo) */
function paint(t,list,pv,px,out,T,tiles){
  const w=t.w,h=t.h;gl.bindFramebuffer(gl.FRAMEBUFFER,t.f);gl.viewport(0,0,w,h);
  list.forEach((L,i)=>{gl.useProgram(L.g.p);if(i)gl.enable(gl.BLEND);else gl.disable(gl.BLEND);
    gl.uniform2f(L.g.uR,w,h);gl.uniform1f(L.g.uT,T-L.tz);gl.uniform1f(L.g.uK,i?L.K:1);gl.uniform4fv(L.g.u,L.u);gl.uniform3fv(L.g.c,L.c);
    if(tiles){gl.enable(gl.SCISSOR_TEST);for(let y=0;y<h;y+=1024)for(let x=0;x<w;x+=1024){gl.scissor(x,y,1024,1024);gl.drawArrays(gl.TRIANGLES,0,3);gl.flush();}gl.disable(gl.SCISSOR_TEST);}
    else gl.drawArrays(gl.TRIANGLES,0,3);});
  gl.disable(gl.BLEND);
  t.x.forEach((x,i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,x);gl.generateMipmap(gl.TEXTURE_2D);});
  gl.bindFramebuffer(gl.FRAMEBUFFER,out);gl.useProgram(post.p);
  gl.uniform1i(post.tC,0);gl.uniform1i(post.tH,1);gl.uniform2f(post.uR,w,h);gl.uniform1f(post.uPx,px);gl.uniform4fv(post.v,pv);gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---------- superfici: nascita, assaggio, deriva, discendenza ---------- */
const S={gen:5,dur:15,modo:"evoluzione",cap:1};
const store=(k,v)=>{try{localStorage.setItem("m0-"+k,v);}catch(e){}},load=k=>{try{return localStorage.getItem("m0-"+k);}catch(e){return null;}};
{const g=+load("g"),d=+load("d"),m=load("m"),c=load("c");if(g>=1&&g<=30)S.gen=g;if(d>=1&&d<=40)S.dur=d;if(m==="nascita")S.modo=m;if(c!==null&&+c>=0&&+c<=2)S.cap=+c;}
const layers=[],pv=new Float32Array(32);
let W=1,H=1,rs=1,TG=null,PT=null,PF=null,T=0,next=0,ferma=false,dirty=true,snap=true,busy=false,adapt=true;
/* assaggio: 64x40 pixel di superficie finita; si scarta ciò che è piatto, buio o bruciato */
function taste(L){
  if(!PT){PT=target(null,64,40);PF={f:gl.createFramebuffer(),x:gl.createTexture()};gl.bindTexture(gl.TEXTURE_2D,PF.x);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,64,40,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.bindFramebuffer(gl.FRAMEBUFFER,PF.f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,PF.x,0);}
  const q=L.post.slice();q[15]=0;q[18]=-1;q[21]=-1;q[8]=-1;
  paint(PT,[L],q,1,PF.f,T);const d=new Uint8Array(64*40*4);gl.readPixels(0,0,64,40,gl.RGBA,gl.UNSIGNED_BYTE,d);
  /* 40 riquadri da 8x8: conta quanto cambiano fra loro (struttura), non il rumore dentro ciascuno */
  const q8=[],mu=[0,0,0];let ex=0;
  for(let i=0;i<40;i++)q8.push([0,0,0]);
  for(let y=0;y<40;y++)for(let x=0;x<64;x++){const i=(y*64+x)*4,e=q8[(y>>3)*8+(x>>3)],l=d[i]*.3+d[i+1]*.59+d[i+2]*.11;if(l<10||l>247)ex++;for(let k=0;k<3;k++){e[k]+=d[i+k]/16320;mu[k]+=d[i+k]/652800;}}
  let sd=0;for(const e of q8)for(let k=0;k<3;k++)sd+=Math.abs(e[k]-mu[k])/120;
  L.stat={sd,ex:ex/2560};return sd>.04&&ex<1150;
}
function make(G){
  const a0=G.a.slice();   /* a ogni scarto si tiene meno del flusso di partenza, poi si riparte da zero */
  for(let k=0;k<8;k++){const g={a:a0.slice(0,Math.floor(a0.length*Math.max(0,1-k/3)))};
    try{const B=build(g),L={G:g,g:prog(B.src,["uR","uT","uK","u","c"]),u:B.u,ut:B.u.slice(),c:B.c,ct:B.c.slice(),post:B.post,K:1,tz:T-Math.random()*600};
      if(taste(L))return L;gl.deleteProgram(L.g.p);}catch(e){if(window.__M0)window.__M0.err=String(e);}}
  return null;
}
function birth(G,now){const L=make(G);if(!L)return;L.K=now?1:0;L.t0=T;L.dur=S.dur*Math.exp((Math.random()-.5)*.3);layers.push(L);dirty=true;}
/* deriva: i valori continui si spostano di poco; il programma resta lo stesso, i numeri scivolano */
function drift(L){const rate=.15+.55*Math.random(),sd=.01*Math.pow(12,Math.random()),a=L.G.a;
  for(const i of L.G.ci)if(Math.random()<rate)a[i]=Math.min(1,Math.max(0,a[i]+gauss()*sd));
  const B=build(L.G);L.ut=B.u;L.ct=B.c;L.post=B.post;}
function generation(){
  const top=layers[layers.length-1],r=Math.random();
  if(!top||(S.modo==="nascita"&&layers.length<3))birth({a:[]},!top);
  else if(S.modo==="nascita")return;
  else if(r<.8||layers.length>=3)drift(top);
  else if(r<.95)birth({a:top.G.a.slice(0,Math.floor(top.G.a.length*(.3+.65*Math.random())))});
  else birth({a:[]});
}

/* ---------- schermo e ritmo ---------- */
function size(w,h){tela.width=W=w;tela.height=H=h;TG=target(TG,w,h);dirty=true;return TG.ok;}
function fit(){const d=Math.min(devicePixelRatio||1,2)*rs;let w=Math.max(2,innerWidth*d),h=Math.max(2,innerHeight*d);const l=Math.max(w,h);if(l>MAXL){w*=MAXL/l;h*=MAXL/l;}size(Math.round(w),Math.round(h));}
let last=0,slow=0,wantCol=false,lost=false;
function frame(now){
  requestAnimationFrame(frame);
  if(lost||busy||now-last<31)return;
  const gap=last?now-last:16,dt=Math.min(.12,gap/1000);last=now;
  if(!ferma){T+=dt;if(T>=next){generation();next=T+S.gen*Math.exp((Math.random()-.5)*.3);}}
  else if(!dirty&&!wantCol)return;
  if(!layers.length)return;
  /* comparse: quando una superficie ha finito di affiorare, quelle sotto si estinguono */
  let full=0;layers.forEach((L,i)=>{if(i&&L.K<1&&!ferma)L.K=Math.min(1,(T-L.t0)/L.dur);if(L.K>=1)full=i;});
  for(const L of layers.splice(0,full))gl.deleteProgram(L.g.p);
  if(full&&adapt&&rs<1){rs=Math.min(1,rs/.85);slow=0;fit();}   /* superficie nuova: si riprova a risoluzione più alta */
  /* i numeri inseguono i loro bersagli */
  const k=ferma?0:1-Math.exp(-dt*3/S.dur),top=layers[layers.length-1];
  for(const L of layers){for(let i=0;i<L.u.length;i++)L.u[i]+=(L.ut[i]-L.u[i])*k;for(let i=0;i<L.c.length;i++)L.c[i]+=(L.ct[i]-L.c[i])*k;}
  for(let i=0;i<32;i++)pv[i]+=(top.post[i]-pv[i])*(snap?1:k);
  paint(TG,layers,pv,1,null,T);dirty=snap=false;
  if(wantCol){wantCol=false;readColors();}
  /* se la macchina arranca si abbassa la risoluzione, non la ricchezza */
  slow=slow*.92+(gap>50?.08:0);
  if(adapt&&slow>.5&&rs>.4){slow=0;rs*=.85;fit();}
}
tela.addEventListener("webglcontextlost",e=>{e.preventDefault();lost=true;note("La scheda grafica si è fermata: ricarico…");setTimeout(()=>location.reload(),1200);});

/* ---------- pannello ---------- */
const pan=$("pannello"),boxCol=$("colori"),rG=$("rGen"),rD=$("rDur"),bEvo=$("bEvo"),bNas=$("bNas"),bFerma=$("bFerma"),bFull=$("bFull"),bDir=$("bDir");
let hideT=null,lastHex=[];
const armHide=()=>{clearTimeout(hideT);hideT=setTimeout(()=>{pan.hidden=true;},10000);};
const showPanel=()=>{pan.hidden=false;wantCol=true;armHide();};
tela.addEventListener("click",()=>{if(pan.hidden)showPanel();else{pan.hidden=true;clearTimeout(hideT);}});
tela.addEventListener("contextmenu",e=>e.preventDefault());
["pointerdown","input","keydown","focusin"].forEach(ev=>pan.addEventListener(ev,armHide));
const tocco=!!(window.matchMedia&&matchMedia("(pointer:coarse)").matches);
const FORM=[["Schermo",0],["4K",4096],["8K",8192]].filter(f=>f[1]<=MAXT&&!((lowEnd||tocco)&&f[1]>4096));
if(S.cap>=FORM.length)S.cap=FORM.length-1;
FORM.forEach((f,i)=>{const b=document.createElement("button");b.type="button";b.textContent=f[0];b.addEventListener("click",()=>{S.cap=i;store("c",i);syncUI();note(f[1]?"Cattura a "+f[1]+" px sul lato lungo.":"Cattura alla risoluzione dello schermo.");});$("formati").appendChild(b);});
function syncUI(){rG.value=S.gen;rD.value=S.dur;const evo=S.modo==="evoluzione";
  $("oGen").textContent=(evo?"una mutazione ogni ":"una nascita ogni ")+S.gen+" s";
  $("oDur").textContent=(evo?"ogni mutazione dura ":"ogni comparsa dura ")+S.dur+" s";
  bEvo.setAttribute("aria-pressed",evo);bNas.setAttribute("aria-pressed",!evo);bFerma.textContent=ferma?"Riprendi":"Ferma";
  [...$("formati").children].forEach((b,i)=>b.setAttribute("aria-pressed",i===S.cap));}
rG.addEventListener("input",()=>{S.gen=+rG.value;store("g",S.gen);syncUI();next=Math.min(next,T+S.gen);});
rD.addEventListener("input",()=>{S.dur=+rD.value;store("d",S.dur);syncUI();});
function setMode(m){S.modo=m;store("m",m);syncUI();next=T;note(m==="evoluzione"?"Evoluzione: la superficie deriva e genera discendenti.":"Nascita: superfici nuove affiorano attraverso le vecchie.");}
bEvo.addEventListener("click",()=>setMode("evoluzione"));bNas.addEventListener("click",()=>setMode("nascita"));
function toggleFerma(){ferma=!ferma;syncUI();note(ferma?"Fermo: il momento resta com'è finché non riprendi.":"Ripreso.");}
bFerma.addEventListener("click",toggleFerma);
function nuovo(){if(layers.length>=3)for(const L of layers.splice(0,layers.length-2))gl.deleteProgram(L.g.p);birth({a:[]});next=T+S.gen;if(ferma){const L=layers[layers.length-1];if(L)L.K=1;snap=true;}note("Una superficie nuova.");}
$("bNuovo").addEventListener("click",nuovo);

/* colori principali: letti dallo schermo, non dichiarati */
const tiny=document.createElement("canvas");tiny.width=48;tiny.height=30;const tctx=tiny.getContext("2d",{willReadFrequently:true});
const hex=c=>"#"+((1<<24)|(c[0]<<16)|(c[1]<<8)|c[2]|0).toString(16).slice(1).toUpperCase();
function readColors(){let d;try{tctx.drawImage(tela,0,0,48,30);d=tctx.getImageData(0,0,48,30).data;}catch(e){return;}
  const bins=new Map();
  for(let i=0;i<d.length;i+=4){const key=((d[i]>>4)<<8)|((d[i+1]>>4)<<4)|(d[i+2]>>4);let e=bins.get(key);if(!e){e=[0,0,0,0];bins.set(key,e);}e[0]++;e[1]+=d[i];e[2]+=d[i+1];e[3]+=d[i+2];}
  const out=[];
  for(const e of[...bins.values()].sort((a,b)=>b[0]-a[0])){const c=[e[1]/e[0]|0,e[2]/e[0]|0,e[3]/e[0]|0];if(out.every(o=>Math.abs(o[0]-c[0])+Math.abs(o[1]-c[1])+Math.abs(o[2]-c[2])>70))out.push(c);if(out.length>=6)break;}
  lastHex=out.map(hex);boxCol.textContent="";
  for(const h of lastHex){const b=document.createElement("button"),i=document.createElement("i");b.type="button";b.className="col";b.title="Copia "+h;i.style.setProperty("--c",h);b.append(i,h);b.addEventListener("click",()=>copy(h));boxCol.appendChild(b);}}
setInterval(()=>{if(!pan.hidden)wantCol=true;},1500);
function copy(t){try{navigator.clipboard.writeText(t).then(()=>note("Copiato: "+t),()=>note(t));}catch(e){note(t);}}
$("bCopia").addEventListener("click",()=>copy(lastHex.join(" ")));

if(!document.fullscreenEnabled)bFull.hidden=true;
bFull.addEventListener("click",()=>{try{const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>note("Lo schermo intero non è disponibile qui."));}catch(e){note("Lo schermo intero non è disponibile qui.");}});
document.addEventListener("fullscreenchange",()=>{bFull.hidden=!!document.fullscreenElement||!document.fullscreenEnabled;});

/* cattura: la superficie viene ridipinta alla risoluzione scelta, identica a ciò che si vede */
let dir=null;
if(window.showDirectoryPicker){bDir.hidden=false;bDir.addEventListener("click",async()=>{try{dir=await window.showDirectoryPicker({mode:"readwrite"});note("Le catture vanno in: "+dir.name);}catch(e){}});}
const stamp=()=>{const d=new Date(),p=n=>("0"+n).slice(-2);return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());};
async function save(blob,name){
  if(dir){try{const w=await(await dir.getFileHandle(name,{create:true})).createWritable();await w.write(blob);await w.close();note("Salvata in "+dir.name+": "+name);return;}catch(e){dir=null;}}
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);note("Scaricata: "+name);}
function capture(){
  if(busy||!layers.length)return;busy=true;note("Preparo l'immagine…");
  setTimeout(()=>{const ow=W,oh=H,long=FORM[S.cap][1],s=long?long/Math.max(W,H):1;let ok=true;
    if(long)ok=size(Math.round(W*s),Math.round(H*s))&&gl.getError()===gl.NO_ERROR;
    const back=()=>{if(long)size(ow,oh);busy=false;dirty=true;};
    if(!ok){back();note("Questa macchina non regge il formato "+FORM[S.cap][0]+": scegline uno più piccolo.");return;}
    paint(TG,layers,pv,W/ow,null,T,true);
    tela.toBlob(b=>{back();if(b)save(b,"Momento_0-"+stamp()+".png");else note("La cattura non è riuscita.");},"image/png");},30);
}
$("bCattura").addEventListener("click",capture);

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="BUTTON")))return;
  const k=e.key.toLowerCase();
  if(k===" "||k==="enter"){e.preventDefault();if(pan.hidden)showPanel();else pan.hidden=true;}
  else if(k==="f"&&!bFull.hidden)bFull.click();
  else if(k==="c")capture();
  else if(k==="p")toggleFerma();
  else if(k==="arrowright")nuovo();
  else if(k==="e")setMode("evoluzione");
  else if(k==="n")setMode("nascita");
});
const keepAwake=async()=>{try{if(navigator.wakeLock&&document.visibilityState==="visible")await navigator.wakeLock.request("screen");}catch(e){}};
document.addEventListener("visibilitychange",keepAwake);keepAwake();
let rt=null;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(fit,250);});

/* ---------- avvio (window.__M0, se definito prima, apre la macchina a un banco di prova) ---------- */
if(window.__M0)Object.assign(window.__M0,{build,make,birth,drift,layers,paint,size,S,pv,capture,gl,set:o=>{if("adapt"in o)adapt=o.adapt;if("ferma"in o)ferma=o.ferma;if("T"in o)T=o.T;dirty=snap=true;},get:()=>({W,H,T,rs,HF})});
fit();syncUI();showPanel();requestAnimationFrame(frame);
})();
</script>
